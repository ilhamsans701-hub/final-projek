<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyMoney</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="assets/logo.png" alt="MyMoney Logo" id="logo-img">
                <h1>MyMoney</h1>
            </div>
            <p class="subtitle">Manajemen Keuangan untuk Mahasiswa</p>
        </header>

        <main>
            <!-- Login Section (halaman terpisah) -->
            <section class="login-section" id="login-section">
                <h2>Login Pengguna</h2>
                <p class="subtitle">Masuk dengan username & password, lalu pilih sebagai Anak atau Orang Tua.</p>

                <form id="login-form" class="login-form active">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="login-username" placeholder="Masukkan username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="login-password" placeholder="Masukkan password" required>
                    </div>

                    <div class="login-role-buttons">
                        <button type="button" id="login-as-anak" class="btn btn-secondary">
                            Masuk sebagai Anak
                        </button>
                        <button type="button" id="login-as-orangtua" class="btn btn-primary">
                            Masuk sebagai Orang Tua
                        </button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 MyMoney - Aplikasi Manajemen Keuangan Mahasiswa</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
